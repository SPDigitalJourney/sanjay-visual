<!DOCTYPE html>
<html>
<head>
  <title>Lead Capture Page</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    form { max-width: 400px; margin: auto; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: #25D366; color: white; padding: 12px; border: none; cursor: pointer; }
    button:hover { background: #128C7E; }
  </style>
</head>
<body>
  <h2>Contact Us</h2>
  <form id="leadForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="tel" id="phone" placeholder="Your Phone Number" required>
    <textarea id="purpose" placeholder="Purpose of Contact" required></textarea>
    <button type="submit">Submit via WhatsApp</button>
  </form>

  <script>
    document.getElementById("leadForm").addEventListener("submit", function(e){
      e.preventDefault();
      let name = document.getElementById("name").value;
      let phone = document.getElementById("phone").value;
      let purpose = document.getElementById("purpose").value;

      let message = `Name: ${name}%0APhone: ${phone}%0APurpose: ${purpose}`;
      let whatsappURL = `https://wa.me/7799423794?text=${message}`;
      window.open(whatsappURL, "_blank");
    });
  </script>
</body>
</html>
